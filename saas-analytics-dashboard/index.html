<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MetricFlow — revenue intelligence workspace: analytics, subscriptions, and pipeline in one portfolio-grade shell."
    />
    <meta name="theme-color" content="#0b1220" />
    <title>MetricFlow</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("saas-analytics-theme");
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.state ? parsed.state.theme : undefined;
          if (theme === undefined || theme === null) theme = "dark";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
